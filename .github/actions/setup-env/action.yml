name: Setup Development Environment
description: macOS environment setup with Node.js and Rust
inputs:
  mode:
    description: |
      Setup mode:
      - build: Complete environment (Node + Rust + System deps + Cache)
      - node: Node.js only (pnpm + Node 22)
      - rust: Rust only (toolchain + targets)
    required: false
    default: build
  rust-cache-save:
    description: |
      Whether this job may save the shared Rust cache. Jobs that do not compile
      the Tauri app must pass "false": the first save wins the key, and a
      target without compiled artifacts would be restored as a full match.
    required: false
    default: true
outputs:
  setup-complete:
    description: Setup completion status
    value: true
runs:
  using: composite
  steps:
    - name: Require macOS
      shell: bash
      run: test "$RUNNER_OS" = "macOS" || { echo "This fork builds on macOS only" >&2; exit 1; }
    - name: Setup environment flags
      shell: bash
      run: |
        MODE="${{ inputs.mode }}"

        # Validate and set flags in one pass
        case "$MODE" in
          build|full)
            echo "SETUP_NODE=true" >> $GITHUB_ENV
            echo "SETUP_RUST=true" >> $GITHUB_ENV
            echo "SETUP_SYSTEM=true" >> $GITHUB_ENV
            ;;
          node|node-only)
            echo "SETUP_NODE=true" >> $GITHUB_ENV
            echo "SETUP_RUST=false" >> $GITHUB_ENV
            echo "SETUP_SYSTEM=false" >> $GITHUB_ENV
            ;;
          rust|rust-only)
            echo "SETUP_NODE=false" >> $GITHUB_ENV
            echo "SETUP_RUST=true" >> $GITHUB_ENV
            echo "SETUP_SYSTEM=false" >> $GITHUB_ENV
            ;;
          *)
            echo "❌ Invalid mode: '$MODE'. Valid modes: build, node, rust"
            exit 1
            ;;
        esac
    - name: Install pnpm
      if: env.SETUP_NODE == 'true'
      uses: pnpm/action-setup@v4
      with:
        version: 10.26.2
        run_install: false
    - name: Setup Node.js
      if: env.SETUP_NODE == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: pnpm
    - name: Install dependencies
      if: env.SETUP_NODE == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Setup Rust for macOS
      if: env.SETUP_RUST == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - name: Add macOS universal targets
      if: env.SETUP_RUST == 'true'
      shell: bash
      run: |
        rustup target add x86_64-apple-darwin
        rustup target add aarch64-apple-darwin
    - name: Setup Rust cache
      if: inputs.mode == 'build'
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        shared-key: pake-build-${{ runner.os }}
        save-if: ${{ inputs.rust-cache-save == 'true' }}
