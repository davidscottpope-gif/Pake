name: Build App With Pake CLI
env:
  NODE_VERSION: '22'
  PNPM_VERSION: 10.26.2
'on':
  workflow_dispatch:
    inputs:
      url:
        description: Website URL
        required: true
      name:
        description: App name
        required: true
      icon:
        description: Icon URL, auto-fetch if empty
        required: false
      width:
        description: Window width (px)
        required: false
        default: '1200'
      height:
        description: Window height (px)
        required: false
        default: '780'
      min_width:
        description: Minimum window width (px)
        required: false
      min_height:
        description: Minimum window height (px)
        required: false
      app_version:
        description: App version
        required: false
        default: 1.0.0
      fullscreen:
        description: Start in fullscreen mode
        required: false
        type: boolean
        default: false
      hide_title_bar:
        description: Hide title bar (macOS only)
        required: false
        type: boolean
        default: false
      new_window:
        description: Allow sites to open new windows
        required: false
        type: boolean
        default: false
      multi_arch:
        description: Universal binary (macOS only)
        required: false
        type: boolean
        default: false
      targets:
        description: Package format (dmg or app)
        required: false
        default: dmg
permissions:
  contents: read
jobs:
  build:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build
      - name: Build CLI
        run: pnpm run cli:build
      - name: Rust cache restore
        uses: actions/cache/restore@v4.2.0
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}
      - name: Build App (macOS)
        timeout-minutes: 25
        shell: bash
        run: |
          ARGS=("$INPUT_URL" "--name" "$INPUT_NAME")

          if [ -n "$INPUT_ICON" ]; then
            ARGS+=("--icon" "$INPUT_ICON")
          fi

          if [ -n "$INPUT_WIDTH" ]; then
            ARGS+=("--width" "$INPUT_WIDTH")
          fi

          if [ -n "$INPUT_HEIGHT" ]; then
            ARGS+=("--height" "$INPUT_HEIGHT")
          fi

          if [ -n "$INPUT_MIN_WIDTH" ]; then
            ARGS+=("--min-width" "$INPUT_MIN_WIDTH")
          fi

          if [ -n "$INPUT_MIN_HEIGHT" ]; then
            ARGS+=("--min-height" "$INPUT_MIN_HEIGHT")
          fi

          if [ -n "$INPUT_APP_VERSION" ]; then
            ARGS+=("--app-version" "$INPUT_APP_VERSION")
          fi

          if [ "$INPUT_FULLSCREEN" == "true" ]; then
            ARGS+=("--fullscreen")
          fi

          if [ "$INPUT_HIDE_TITLE_BAR" == "true" ]; then
            ARGS+=("--hide-title-bar")
          fi

          if [ "$INPUT_NEW_WINDOW" == "true" ]; then
            ARGS+=("--new-window")
          fi

          if [ "$INPUT_MULTI_ARCH" == "true" ]; then
            ARGS+=("--multi-arch")
          fi

          if [ -n "$INPUT_TARGETS" ]; then
            ARGS+=("--targets" "$INPUT_TARGETS")
          fi

          echo "Running: node dist/cli.js ${ARGS[@]}"
          node dist/cli.js "${ARGS[@]}"
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_ICON: ${{ inputs.icon }}
          INPUT_WIDTH: ${{ inputs.width }}
          INPUT_HEIGHT: ${{ inputs.height }}
          INPUT_MIN_WIDTH: ${{ inputs.min_width }}
          INPUT_MIN_HEIGHT: ${{ inputs.min_height }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_FULLSCREEN: ${{ inputs.fullscreen }}
          INPUT_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          INPUT_NEW_WINDOW: ${{ inputs.new_window }}
          INPUT_MULTI_ARCH: ${{ inputs.multi_arch }}
          INPUT_TARGETS: ${{ inputs.targets }}
          PAKE_CREATE_APP: '1'
      - name: Upload DMG (macOS)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS
          path: ${{ inputs.name }}.dmg
          retention-days: 3
      - name: Rust cache store
        uses: actions/cache/save@v4.2.0
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}
