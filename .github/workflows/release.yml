name: Release & Publish
'on':
  push:
    tags:
      - V*
  workflow_dispatch:
    inputs:
      release_apps:
        description: Build popular apps
        type: boolean
        default: false
env:
  NODE_VERSION: '22'
  PNPM_VERSION: 10.26.2
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-apps:
    permissions:
      contents: read
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_apps)
    runs-on: macos-latest
    outputs:
      apps_name: ${{ steps.read-apps-config.outputs.apps_name }}
      apps_config: ${{ steps.read-apps-config.outputs.apps_config }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Get Apps Config
        id: read-apps-config
        run: |
          echo "apps_name=$(jq -c '[.[] | .name]' default_app_list.json)" >> $GITHUB_OUTPUT
          echo "apps_config=$(jq -c '.' default_app_list.json)" >> $GITHUB_OUTPUT
  create-release:
    name: Create GitHub Release
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create release placeholder
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skipIfReleaseExists: true
  move-major-tag:
    name: Move Major Action Tag
    runs-on: macos-latest
    needs: build-cli
    if: |
      needs.build-cli.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/V')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Force-move major tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^V([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping major tag for non-release tag $RELEASE_TAG"
            exit 0
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MAJOR_TAG="v$MAJOR"
          # Only the newest release of this major may own the tag, so re-pushing
          # an older V tag never moves it back.
          LATEST_TAG="$(git ls-remote --tags --refs origin "refs/tags/V$MAJOR.*" \
            | sed 's#.*refs/tags/##' \
            | grep -E "^V$MAJOR\.[0-9]+\.[0-9]+$" \
            | sort -V | tail -n 1)"
          if [ "$RELEASE_TAG" != "$LATEST_TAG" ]; then
            echo "Skipping $MAJOR_TAG: $RELEASE_TAG is not the latest V$MAJOR release ($LATEST_TAG)"
            exit 0
          fi
          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR_TAG"
          echo "Moved $MAJOR_TAG to $GITHUB_SHA ($RELEASE_TAG)"
  build-cli:
    permissions:
      contents: read
    name: Build CLI
    needs: release-apps
    if: needs.release-apps.result == 'success'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: node
      - name: Build CLI
        run: pnpm run cli:build
      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v6
        with:
          name: pake-cli-dist
          path: dist/
          retention-days: 1
  build-popular-apps:
    permissions:
      contents: write
    name: ${{ matrix.config.title }}
    needs:
      - release-apps
      - build-cli
      - create-release
    if: |
      needs.release-apps.result == 'success' &&
      needs.build-cli.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      matrix:
        config: ${{ fromJSON(needs.release-apps.outputs.apps_config) }}
    uses: ./.github/workflows/single-app.yaml
    secrets: inherit
    with:
      name: ${{ matrix.config.name }}
      title: ${{ matrix.config.title }}
      name_zh: ${{ matrix.config.name_zh }}
      url: ${{ matrix.config.url }}
      icon: ${{ matrix.config.icon }}
      new_window: ${{ matrix.config.new_window || false }}
      incognito: ${{ matrix.config.incognito || false }}
      width: ${{ matrix.config.width || 1200 }}
      height: ${{ matrix.config.height || 780 }}
